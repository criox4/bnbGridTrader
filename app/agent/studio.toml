[project]
name = "bnbGridTrader-agent"

[stack]
# Project-lifetime facts: which framework / runtime adapter recipes this
# Agent was scaffolded against. doctor / dev / deploy read these to know
# what to check, load, and route. framework: adk; runtime: agentcore | azure-foundry.
framework = "adk"
runtime = "agentcore"
# External protocol this runtime serves (one runtime, one signer):
#   A2A — serve_a2a: agent card + negotiate/notify_funded skills.
#   MCP — FastMCP on /mcp: negotiate (signed quote) + notify_funded (verify →
#         deliver → submit, synchronously within the tool call) + read-only chain
#         tools. MCP delivery runs in-call (≤ ~15 min); the runtime is stateful.
protocol = "A2A"

[network]
default = "bsc-mainnet"

[wallet]
# Local keystore signer. The Agent is the SOLE key-holder/signer.
# The keystore lives at the WORKSPACE root — outside app/agent (the AgentCore
# codeLocation) — so no packaging path can bundle it into a deploy artifact.
kind = "evm-local"
signer = "local"
keystore_dir = "../../.studio/wallets"
# address = "0x..."   # filled by `bag wallet new`
address = "0xFAf0ffd121947B9EE3920Fa0CfbF9EEEB0AcBF7f"

[llm]
provider = "openrouter"
model = "openai/gpt-4o-mini"

[payments.erc8183]
# Read by the Agent: it quotes the FIXED `price`, CLAMPS it to [min,max],
# freezes a short-TTL offer, and EIP-191 signs it — pricing is rule-based, the
# LLM never prices.
currency = "0xcE24439F2D9C6a2289F741120FE202248B666666"   # $U token on bsc-MAINNET (chain 56).
# MUST match [network].default. Switching networks does NOT update this line,
# and a stale value makes the agent sign quotes for one chain denominated in a
# token that only exists on the other — a signed, worthless quote.
# Testnet value: 0xc70B8741B8B07A6d61E54fd4B20f22Fa648E5565 (chain 97).
# chain.check_config_consistency() compares the two at boot rather than trusting it.
price = "100000000000000000"                   # wei — your list price (0.1 U); what every quote charges
min_price = "0"                                # wei — clamp floor
max_price = "1000000000000000000"                                 # wei — clamp ceiling; SET before going live
quote_ttl_seconds = 900                        # seconds a signed quote stays valid; SDK caps at 900 (~15min work window)
default_estimated_completion_seconds = 600
poll_interval_seconds = 30
auto_settle = false                            # opt-in: detect dispute-window-elapsed → settle

[strategy]
# Grid parameters. Read by chain.strategy_config(); edit here, not in code.
# A full sweep costs order_size_usdt * levels, which must fit max_capital_usdt.
pair = "BNB/USDT"
fee = 500                    # pool fee tier, hundredths of a bip (500 = 0.05%)

levels = 9                   # rungs spanning the range, geometrically spaced
range_pct = 10.0             # grid half-width: +/-10% around the activation price
# PER-NETWORK, because trade sizing does not port between chains. Both pools
# measured live with the quoter on 2026-08-18 — these are readings, not guesses:
#
#   bsc-testnet (shallow, unarbitraged)   bsc-mainnet (deep)
#     0.01 USDT ->  0.13% impact             1 USDT -> 0.0477% impact
#     0.05 USDT ->  0.47% impact           100 USDT -> 0.0480% impact
#     0.50 USDT ->  7.80% impact          1000 USDT -> 0.0511% impact
#     1.00 USDT -> 22.85% impact          5000 USDT -> 0.0645% impact
#
# On testnet 1.0 USDT would trip the impact guard and the grid would never move.
# On mainnet depth is a non-issue and CAPITAL is the constraint instead. A single
# scalar here would carry one chain's sizes onto the other the first time anyone
# exported $BNB_NETWORK; chain.py refuses to run without an entry for the active
# network. Re-measure before raising either.
order_size_usdt  = { bsc-mainnet = 5.0,  bsc-testnet = 0.05 }
max_capital_usdt = { bsc-mainnet = 50.0, bsc-testnet = 0.5 }

# Execution guards, also per-network. max_slippage_pct bounds the fill against
# the QUOTE; max_price_impact_pct bounds the quote itself against spot. On the
# shallow testnet pool the second is what actually protects you; on mainnet both
# can be tight because the pool barely moves.
max_slippage_pct     = { bsc-mainnet = 0.5, bsc-testnet = 1.0 }
max_price_impact_pct = { bsc-mainnet = 0.5, bsc-testnet = 2.0 }
min_gas_reserve_bnb = 0.02   # never spend the wallet below this; gas must survive

poll_interval_seconds = 60

[storage]
# Deliverables written to local disk (file://). Offline-dev only —
# does NOT survive deploy. Path from STORAGE_LOCAL_PATH.
kind = "local"

[identity]
# Written by `bag erc8004 register`. `agent_id` below is the MAINNET one; the
# id is PER-NETWORK and this file records only one, so the other lives here:
#
#   bsc-mainnet  269233   name "BNB Grid Trader (test)"
#   bsc-testnet    1838   name "BNB Grid Trader"
#
# The agentURI is MUTABLE — setAgentURI replaces the whole document, so name,
# description and endpoint are all fixable in place on the same id. But
# `bag erc8004 update-endpoint` finds the agent via the 8004scan indexer, which
# only scans the newest ~1000 agents: the sibling project's mainnet id aged out
# and the CLI then reported "no registered agent" for a token that reads fine
# on-chain. If that happens, update by token id through the library instead.
#
# Both point at a nip.io host, which is deliberate for a test deployment — see
# MEMORY.md. Moving to a real domain means a setAgentURI on BOTH ids.
endpoint = "https://bnb-grid.172-104-171-139.nip.io/.well-known/agent-card.json"
registered_at = "2026-08-17T20:10:45.004844+00:00"
agent_id = 269233
