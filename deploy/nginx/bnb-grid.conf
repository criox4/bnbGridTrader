# nginx site for the BNB Grid Trader, terminating TLS on the VPS host.
#
#   cp deploy/nginx/bnb-grid.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/bnb-grid.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d bnb-grid.172-104-171-139.nip.io
#
# Ships HTTP-only on purpose. `certbot --nginx` EDITS THIS BLOCK IN PLACE to add
# `listen 443 ssl`, the cert paths and the HTTP->HTTPS redirect, and it can only
# do that to a config nginx already loads. A 443 block with placeholder cert
# paths fails `nginx -t`, so certbot never runs and you are stuck.
#
# ONE hostname, because this agent is one process. It is published on-chain by
# submit_result as {ERC8183_AGENT_URL}/job/{id}/response and is what buyers
# resolve the agent card from, so it must match ERC8183_AGENT_URL exactly and
# must never change while any submitted job is unsettled.

upstream bnb_grid_agent {
    # compose binds this on loopback only (docker's iptables rules run ahead of
    # ufw's, so a 0.0.0.0 publish would be world-reachable regardless of the
    # firewall). nginx is deliberately the only thing that can reach it.
    server 127.0.0.1:9001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name bnb-grid.172-104-171-139.nip.io;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "no-referrer" always;
    server_tokens off;

    access_log /var/log/nginx/bnb-grid.access.log;
    error_log  /var/log/nginx/bnb-grid.error.log;

    client_max_body_size 1m;

    location = /ping {
        proxy_pass http://bnb_grid_agent;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://bnb_grid_agent;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # notify_funded acks fast and does the LLM work in the background, so
        # these are short requests. The generous read timeout is for negotiate,
        # which signs against a live RPC read.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
